name: goose
kind: coding-agent
image: node:22-bookworm-slim
resources:
  min_ram: 4GB
volumes:
  home: /root
env:
  GOOSE_PROVIDER: openai
command: [sleep, infinity]
build:
  src: Dockerfile
  dst: /root/.olympus-build/Dockerfile
health:
  command: [goose, --version]
  timeout: 60s
secrets:
  model-key:
    env: OPENAI_API_KEY
supports:
  skills:
    dir: /root/.agents/skills
    mode: mount
