name: openclaw
kind: harness
image: ghcr.io/openclaw/openclaw:2026.11.1
resources:
  min_ram: 2GB
volumes:
  data: /home/node/.openclaw
  # Auth-profile secrets; upstream docker-compose.yml mounts this separately.
  auth: /home/node/.config/openclaw
ports: [18789]
# --allow-unconfigured: a fresh volume has no openclaw.json, and the gateway
# refuses to start without gateway.mode=local. Upstream's Render blueprint uses
# the same flag; it waives only that prerequisite, not the token guard.
command: [node, openclaw.mjs, gateway, --allow-unconfigured, --bind, lan, --port, "18789"]
runtime:
  no_new_privileges: true
health:
  http:
    port: 18789
    path: /healthz
  timeout: 60s
secrets:
  model-key:
    env: ANTHROPIC_API_KEY
  gateway-token:
    env: OPENCLAW_GATEWAY_TOKEN
supports:
  skills:
    dir: /home/node/.openclaw/skills
    mode: mount
