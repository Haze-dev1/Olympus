# Source repository for Olympus recipes
inputs:
  # Official Olympus recipes repository
  recipes: github:Haze-dev1/Olympus/recipes

# Target server deployment configuration
server:
  # Host IP address (TEST-NET placeholder)
  host: 203.0.113.10
  # SSH user with root access
  user: root

# Shared Model Context Protocol (MCP) server definitions
mcps:
  # Stdio MCP server: GitHub repository access
  github:
    # Command binary to execute
    command: npx
    # Arguments passed to the command
    args: ["@modelcontextprotocol/server-github"]
    # Environment variables for the MCP server process
    env:
      # GitHub personal access token referenced from .env
      GITHUB_TOKEN: ${GH_TOKEN}

  # Remote HTTP MCP server: team documentation service
  docs:
    # Endpoint URL for the remote documentation service
    url: https://mcp.example.test/mcp
    # Remote wire protocol: http (Streamable HTTP, default) or sse
    transport: http
    # HTTP headers sent with each request
    headers:
      # Authorization bearer header referencing the GitHub token
      Authorization: Bearer ${GH_TOKEN}

# Shared skills available to all team members
skills:
  # Team development workflow guidelines
  - ./skills/team-guidelines

# Multi-agent team members
agents:
  # Hermes: user-facing chat coordinator via Telegram
  hermes:
    # Recipe name from the catalog
    recipe: hermes
    # Shared MCP servers granted to Hermes
    mcps: [github, docs]
    # Shared skills granted to Hermes
    skills: all
    # Secrets required by Hermes
    secrets:
      # Anthropic API key for the model
      model-key: ${ANTHROPIC_API_KEY}
      # Telegram bot token for chat interface
      telegram-token: ${TELEGRAM_BOT_TOKEN}
      # GitHub token for repository operations
      github-token: ${GH_TOKEN}
    # Chat channels connecting Hermes to users
    channels:
      # Telegram channel configuration
      telegram:
        # Token reference matching secrets.telegram-token
        token: ${TELEGRAM_BOT_TOKEN}
        # Numeric Telegram user IDs authorized to interact with the team
        allow: ["123456789"]

  # Codex: backend coding agent
  codex:
    # Recipe name from the catalog
    recipe: codex
    # Shared MCP servers granted to Codex
    mcps: [github, docs]
    # Shared skills granted to Codex
    skills: all
    # Secrets required by Codex
    secrets:
      # OpenAI API key for Codex
      api-key: ${CODEX_API_KEY}
      # GitHub token for repository operations
      github-token: ${GH_TOKEN}

  # Claude Code: interactive refactoring and testing agent
  claude:
    # Recipe name from the catalog
    recipe: claude-code
    # Shared MCP servers granted to Claude Code
    mcps: [github, docs]
    # Shared skills granted to Claude Code
    skills: all
    # Secrets required by Claude Code
    secrets:
      # Anthropic API key for Claude Code
      model-key: ${ANTHROPIC_API_KEY}
      # GitHub token for repository operations
      github-token: ${GH_TOKEN}

  # OpenCode: web and headless coding agent
  opencode:
    # Recipe name from the catalog
    recipe: opencode
    # Shared MCP servers granted to OpenCode
    mcps: [github, docs]
    # Shared skills granted to OpenCode
    skills: all
    # Secrets required by OpenCode
    secrets:
      # Anthropic API key for OpenCode
      model-key: ${ANTHROPIC_API_KEY}
      # GitHub token for repository operations
      github-token: ${GH_TOKEN}
