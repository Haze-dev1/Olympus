---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      all-updates:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
