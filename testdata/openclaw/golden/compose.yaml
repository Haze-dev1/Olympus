name: olympus
services:
  openclaw:
    command:
    - node
    - openclaw.mjs
    - gateway
    - --allow-unconfigured
    - --bind
    - lan
    - --port
    - "18789"
    env_file:
    - /var/lib/olympus/secrets/openclaw/environment
    image: ghcr.io/openclaw/openclaw:2026.11.1@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
    labels:
      org.olympus.tool: openclaw
    ports:
    - 127.0.0.1:18789:18789
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    volumes:
    - source: openclaw_auth
      target: /home/node/.config/openclaw
      type: volume
    - source: openclaw_data
      target: /home/node/.openclaw
      type: volume
    - read_only: true
      source: /var/lib/olympus/store/sha256-d5f81f34dde0d75402f490e7eccc120b0d4b131def237709439a87d34156d1c8/files/home/node/.openclaw/skills/deploy-checklist/SKILL.md
      target: /home/node/.openclaw/skills/deploy-checklist/SKILL.md
      type: bind
volumes:
  openclaw_auth:
    name: olympus_openclaw_auth
  openclaw_data:
    name: olympus_openclaw_data
