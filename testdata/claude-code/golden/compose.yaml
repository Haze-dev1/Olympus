name: olympus
services:
  claude:
    build:
      args:
        BASE_IMAGE: node:22-bookworm-slim@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      context: /var/lib/olympus/store/sha256-4014c234e10dc16d5582c8cc40b254035b53b1818c9073ed425741e63913b34d/files/root/.olympus-build
      dockerfile: Dockerfile
    command:
    - sleep
    - infinity
    env_file:
    - /var/lib/olympus/secrets/claude/environment
    environment:
      DISABLE_AUTOUPDATER: "1"
    image: olympus/claude:sha256-817a0e10a968
    labels:
      org.olympus.tool: claude
    restart: unless-stopped
    volumes:
    - source: claude_home
      target: /root
      type: volume
    - read_only: true
      source: /var/lib/olympus/store/sha256-4014c234e10dc16d5582c8cc40b254035b53b1818c9073ed425741e63913b34d/files/root/.claude/skills/deploy-checklist/SKILL.md
      target: /root/.claude/skills/deploy-checklist/SKILL.md
      type: bind
    - read_only: true
      source: /var/lib/olympus/store/sha256-4014c234e10dc16d5582c8cc40b254035b53b1818c9073ed425741e63913b34d/files/root/.mcp.json
      target: /root/.mcp.json
      type: bind
    - read_only: true
      source: /var/lib/olympus/store/sha256-4014c234e10dc16d5582c8cc40b254035b53b1818c9073ed425741e63913b34d/files/root/.olympus-build/Dockerfile
      target: /root/.olympus-build/Dockerfile
      type: bind
    - read_only: true
      source: /var/lib/olympus/store/sha256-4014c234e10dc16d5582c8cc40b254035b53b1818c9073ed425741e63913b34d/files/root/.olympus-build/package-lock.json
      target: /root/.olympus-build/package-lock.json
      type: bind
    - read_only: true
      source: /var/lib/olympus/store/sha256-4014c234e10dc16d5582c8cc40b254035b53b1818c9073ed425741e63913b34d/files/root/.olympus-build/package.json
      target: /root/.olympus-build/package.json
      type: bind
volumes:
  claude_home:
    name: olympus_claude_home
