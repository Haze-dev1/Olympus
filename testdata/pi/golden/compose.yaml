name: olympus
services:
  pi:
    build:
      args:
        BASE_IMAGE: node:22-bookworm-slim@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      context: /var/lib/olympus/store/sha256-93090ef29ea63402c6c70e24bc321f574588ace89d2e2ad6fb9166315de05fce/files/root/.olympus-build
      dockerfile: Dockerfile
    command:
    - sleep
    - infinity
    env_file:
    - /var/lib/olympus/secrets/pi/environment
    environment:
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
    image: olympus/pi:sha256-383520e7f744
    labels:
      org.olympus.tool: pi
    restart: unless-stopped
    volumes:
    - source: pi_home
      target: /root
      type: volume
    - read_only: true
      source: /var/lib/olympus/store/sha256-93090ef29ea63402c6c70e24bc321f574588ace89d2e2ad6fb9166315de05fce/files/root/.olympus-build/Dockerfile
      target: /root/.olympus-build/Dockerfile
      type: bind
    - read_only: true
      source: /var/lib/olympus/store/sha256-93090ef29ea63402c6c70e24bc321f574588ace89d2e2ad6fb9166315de05fce/files/root/.pi/agent/mcp.json
      target: /root/.pi/agent/mcp.json
      type: bind
    - read_only: true
      source: /var/lib/olympus/store/sha256-93090ef29ea63402c6c70e24bc321f574588ace89d2e2ad6fb9166315de05fce/files/root/.pi/agent/skills/deploy-checklist/SKILL.md
      target: /root/.pi/agent/skills/deploy-checklist/SKILL.md
      type: bind
volumes:
  pi_home:
    name: olympus_pi_home
