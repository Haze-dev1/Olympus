name: olympus
services:
  goose:
    build:
      args:
        BASE_IMAGE: node:22-bookworm-slim@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      context: /var/lib/olympus/store/sha256-8299dd8a8fd7f374f26ef155c498cde38278a467a5bf5c51a6581790476cd684/files/root/.olympus-build
      dockerfile: Dockerfile
    command:
    - sleep
    - infinity
    env_file:
    - /var/lib/olympus/secrets/goose/environment
    environment:
      GOOSE_PROVIDER: openai
    image: olympus/goose:sha256-023244b0844d
    labels:
      org.olympus.tool: goose
    restart: unless-stopped
    volumes:
    - source: goose_home
      target: /root
      type: volume
    - read_only: true
      source: /var/lib/olympus/store/sha256-8299dd8a8fd7f374f26ef155c498cde38278a467a5bf5c51a6581790476cd684/files/root/.agents/skills/deploy-checklist/SKILL.md
      target: /root/.agents/skills/deploy-checklist/SKILL.md
      type: bind
    - read_only: true
      source: /var/lib/olympus/store/sha256-8299dd8a8fd7f374f26ef155c498cde38278a467a5bf5c51a6581790476cd684/files/root/.olympus-build/Dockerfile
      target: /root/.olympus-build/Dockerfile
      type: bind
volumes:
  goose_home:
    name: olympus_goose_home
