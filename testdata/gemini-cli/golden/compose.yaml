name: olympus
services:
  gemini:
    build:
      args:
        BASE_IMAGE: node:22-bookworm-slim@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      context: /var/lib/olympus/store/sha256-b770d47a07c8a8704dbc0fa1bbf391006804546e14210870c25fbd641b664f25/files/root/.olympus-build
      dockerfile: Dockerfile
    command:
    - sleep
    - infinity
    depends_on:
      gemini-init:
        condition: service_completed_successfully
    env_file:
    - /var/lib/olympus/secrets/gemini/environment
    image: olympus/gemini:sha256-74ac91570b34
    labels:
      org.olympus.tool: gemini
    restart: unless-stopped
    volumes:
    - source: gemini_home
      target: /root
      type: volume
    - read_only: true
      source: /var/lib/olympus/store/sha256-b770d47a07c8a8704dbc0fa1bbf391006804546e14210870c25fbd641b664f25/files/root/.gemini/skills/deploy-checklist/SKILL.md
      target: /root/.gemini/skills/deploy-checklist/SKILL.md
      type: bind
    - read_only: true
      source: /var/lib/olympus/store/sha256-b770d47a07c8a8704dbc0fa1bbf391006804546e14210870c25fbd641b664f25/files/root/.olympus-build/Dockerfile
      target: /root/.olympus-build/Dockerfile
      type: bind
    - read_only: true
      source: /var/lib/olympus/store/sha256-b770d47a07c8a8704dbc0fa1bbf391006804546e14210870c25fbd641b664f25/files/root/.olympus-build/package-lock.json
      target: /root/.olympus-build/package-lock.json
      type: bind
    - read_only: true
      source: /var/lib/olympus/store/sha256-b770d47a07c8a8704dbc0fa1bbf391006804546e14210870c25fbd641b664f25/files/root/.olympus-build/package.json
      target: /root/.olympus-build/package.json
      type: bind
  gemini-init:
    build:
      args:
        BASE_IMAGE: node:22-bookworm-slim@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      context: /var/lib/olympus/store/sha256-b770d47a07c8a8704dbc0fa1bbf391006804546e14210870c25fbd641b664f25/files/root/.olympus-build
      dockerfile: Dockerfile
    entrypoint:
    - /bin/sh
    - -c
    - |
      mkdir -p '/root/.gemini' && cp '/olympus-init/0' '/root/.gemini/settings.json' || exit 1
    image: olympus/gemini:sha256-74ac91570b34
    labels:
      org.olympus.role: init
      org.olympus.tool: gemini
    restart: "no"
    volumes:
    - source: gemini_home
      target: /root
      type: volume
    - read_only: true
      source: /var/lib/olympus/store/sha256-b770d47a07c8a8704dbc0fa1bbf391006804546e14210870c25fbd641b664f25/files/root/.gemini/settings.json
      target: /olympus-init/0
      type: bind
volumes:
  gemini_home:
    name: olympus_gemini_home
