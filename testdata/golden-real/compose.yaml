name: olympus
services:
  codex:
    build:
      args:
        BASE_IMAGE: node:22-bookworm-slim@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      context: /var/lib/olympus/store/sha256-af7e34c305e9f709d64e5ed569f82fdeede5dcaab807f7c7b5cb1fdfa9bb24db/files/root/.olympus-build
      dockerfile: Dockerfile
    command:
    - sleep
    - infinity
    depends_on:
      codex-init:
        condition: service_completed_successfully
    env_file:
    - /var/lib/olympus/secrets/codex/environment
    environment:
      CODEX_HOME: /root/.codex
    image: olympus/codex:sha256-3d123fc04a15
    labels:
      org.olympus.tool: codex
    restart: unless-stopped
    volumes:
    - source: codex_home
      target: /root
      type: volume
    - read_only: true
      source: /var/lib/olympus/store/sha256-af7e34c305e9f709d64e5ed569f82fdeede5dcaab807f7c7b5cb1fdfa9bb24db/files/root/.olympus-build/Dockerfile
      target: /root/.olympus-build/Dockerfile
      type: bind
  codex-init:
    build:
      args:
        BASE_IMAGE: node:22-bookworm-slim@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      context: /var/lib/olympus/store/sha256-af7e34c305e9f709d64e5ed569f82fdeede5dcaab807f7c7b5cb1fdfa9bb24db/files/root/.olympus-build
      dockerfile: Dockerfile
    entrypoint:
    - /bin/sh
    - -c
    - |
      mkdir -p '/root/.codex' && cp -a '/olympus-init/0' '/root/.codex/config.toml'
    image: olympus/codex:sha256-3d123fc04a15
    labels:
      org.olympus.role: init
      org.olympus.tool: codex
    restart: "no"
    volumes:
    - source: codex_home
      target: /root
      type: volume
    - read_only: true
      source: /var/lib/olympus/store/sha256-af7e34c305e9f709d64e5ed569f82fdeede5dcaab807f7c7b5cb1fdfa9bb24db/files/root/.codex/config.toml
      target: /olympus-init/0
      type: bind
  hermes:
    command:
    - gateway
    - run
    depends_on:
      hermes-init:
        condition: service_completed_successfully
    env_file:
    - /var/lib/olympus/secrets/hermes/environment
    environment:
      HERMES_HOME: /opt/data
      TELEGRAM_ALLOWED_USERS: "@alice,@bob"
    image: nousresearch/hermes-agent@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    labels:
      org.olympus.tool: hermes
    restart: unless-stopped
    volumes:
    - source: hermes_data
      target: /opt/data
      type: volume
  hermes-init:
    entrypoint:
    - /bin/sh
    - -c
    - "set -eu\nroot='/opt/data/skills'\nledger=\"$$root/.olympus-managed-files\"\ncheck_path() {\n current=''\n rest=\"$$1\"\n while [ -n \"$$rest\" ]; do\n  part=$${rest%%/*}\n  if [ \"$$part\" = \"$$rest\" ]; then rest=''; else rest=$${rest#*/}; fi\n  [ -n \"$$part\" ] || continue\n  case \"$$part\" in .|..) exit 1;; esac\n  current=\"$$current/$$part\"\n  [ ! -L \"$$current\" ] || exit 1\n done\n}\ncheck_path \"$$ledger\"\nif [ -f \"$$ledger\" ]; then\n while IFS= read -r rel || [ -n \"$$rel\" ]; do\n  case \"$$rel\" in ''|/*|*[!A-Za-z0-9._@+/-]*|'.olympus-managed-files') exit 1;; esac\n  check_path \"$$root/$$rel\"\n done < \"$$ledger\"\n while IFS= read -r rel || [ -n \"$$rel\" ]; do\n  rm -f -- \"$$root/$$rel\"\n done < \"$$ledger\"\nfi\ncheck_path '/opt/data/config.yaml'\nmkdir -p '/opt/data' && cp -a '/olympus-init/0' '/opt/data/config.yaml'\ncheck_path '/opt/data/skills/deploy-checklist/SKILL.md'\nmkdir -p '/opt/data/skills/deploy-checklist' && cp -a '/olympus-init/1' '/opt/data/skills/deploy-checklist/SKILL.md'\ncheck_path '/opt/data/skills/.olympus-managed-files'\ncheck_path '/opt/data/skills/.olympus-managed-files.next'\nmkdir -p '/opt/data/skills' && cp -a '/olympus-init/2' '/opt/data/skills/.olympus-managed-files.next' && mv -f '/opt/data/skills/.olympus-managed-files.next' '/opt/data/skills/.olympus-managed-files'\n"
    image: nousresearch/hermes-agent@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    labels:
      org.olympus.role: init
      org.olympus.tool: hermes
    restart: "no"
    volumes:
    - source: hermes_data
      target: /opt/data
      type: volume
    - read_only: true
      source: /var/lib/olympus/store/sha256-b282d770da91f2dbf4f1a7419d240223f27804c15da9b46b91898e1eaed46e8b/files/opt/data/config.yaml
      target: /olympus-init/0
      type: bind
    - read_only: true
      source: /var/lib/olympus/store/sha256-b282d770da91f2dbf4f1a7419d240223f27804c15da9b46b91898e1eaed46e8b/files/opt/data/skills/deploy-checklist/SKILL.md
      target: /olympus-init/1
      type: bind
    - read_only: true
      source: /var/lib/olympus/store/sha256-b282d770da91f2dbf4f1a7419d240223f27804c15da9b46b91898e1eaed46e8b/files/opt/data/skills/.olympus-managed-files
      target: /olympus-init/2
      type: bind
  opencode:
    command:
    - serve
    - --hostname
    - 0.0.0.0
    - --port
    - "4096"
    depends_on:
      opencode-init:
        condition: service_completed_successfully
    env_file:
    - /var/lib/olympus/secrets/opencode/environment
    image: ghcr.io/anomalyco/opencode@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    labels:
      org.olympus.tool: opencode
    ports:
    - 127.0.0.1:4096:4096
    restart: unless-stopped
    volumes:
    - source: opencode_config
      target: /root/.config/opencode
      type: volume
    - source: opencode_data
      target: /root/.local/share/opencode
      type: volume
    - read_only: true
      source: /var/lib/olympus/store/sha256-9efb9c26f0458870d820b794cafef5de2541bd0c729e1cc2ab39313961bb53d3/files/root/.config/opencode/skills/deploy-checklist/SKILL.md
      target: /root/.config/opencode/skills/deploy-checklist/SKILL.md
      type: bind
  opencode-init:
    entrypoint:
    - /bin/sh
    - -c
    - |
      mkdir -p '/root/.config/opencode' && cp -a '/olympus-init/0' '/root/.config/opencode/opencode.json'
    image: ghcr.io/anomalyco/opencode@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    labels:
      org.olympus.role: init
      org.olympus.tool: opencode
    restart: "no"
    volumes:
    - source: opencode_config
      target: /root/.config/opencode
      type: volume
    - source: opencode_data
      target: /root/.local/share/opencode
      type: volume
    - read_only: true
      source: /var/lib/olympus/store/sha256-9efb9c26f0458870d820b794cafef5de2541bd0c729e1cc2ab39313961bb53d3/files/root/.config/opencode/opencode.json
      target: /olympus-init/0
      type: bind
volumes:
  codex_home:
    name: olympus_codex_home
  hermes_data:
    name: olympus_hermes_data
  opencode_config:
    name: olympus_opencode_config
  opencode_data:
    name: olympus_opencode_data
